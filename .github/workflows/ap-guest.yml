name: AP guest smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.19
      - run: python lab.py setup --engine esp-emu
      - run: python lab.py build --profile ap
      - run: python lab.py doctor --profile ap
      - run: python lab.py run --profile ap --name ci-ap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ap-guest-results
          path: |
            results/ci-ap/*.json
            results/ci-ap/*.log
            results/build-logs/*.log
            results/run-logs/*.log
          if-no-files-found: warn
